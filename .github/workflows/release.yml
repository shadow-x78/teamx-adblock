# ─────────────────────────────────────────────
# TeamX - AdBlock - Release Workflow
# ─────────────────────────────────────────────

# ── Workflow Identity ──
name: Release & Package Extension

# ── Trigger ──
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# ── Permissions ──
permissions:
  contents: write

# ── Build Job ──
jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      # ── Repository & Tooling ──
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Forbid Tracked Signing Keys
        run: |
          if git ls-files | grep -Ei '\.(pem|key|p12|pfx)$'; then
            echo "::error::A signing key is tracked by git. Remove it and rotate the key."
            exit 1
          fi

      - name: Setup Node.js & Chrome
        uses: browser-actions/setup-chrome@c785b87e244131f27c9f19c1a33e2ead956ab7ce # v1
        with:
          chrome-version: stable

      # ── Unsigned Archives ──
      - name: Prepare Extension Archives (ZIP & Firefox XPI)
        run: |
          mkdir -p dist
          zip -r dist/TeamX-AdBlock.zip manifest.json shared.js content.js bridge.js background.js popup.html popup.css popup.js rules.css rules.json icons/ updates.xml README.md LICENSE
          mkdir -p /tmp/firefox-ext
          cp -r manifest.json shared.js content.js bridge.js background.js popup.html popup.css popup.js rules.css rules.json icons updates.xml README.md LICENSE /tmp/firefox-ext/
          node -e "const fs=require('fs');const p='/tmp/firefox-ext/manifest.json';const m=JSON.parse(fs.readFileSync(p,'utf8'));delete m.update_url;fs.writeFileSync(p,JSON.stringify(m,null,2)+'\n');"
          cd /tmp/firefox-ext && zip -r "$GITHUB_WORKSPACE/dist/TeamX-AdBlock.xpi" manifest.json shared.js content.js bridge.js background.js popup.html popup.css popup.js rules.css rules.json icons/ updates.xml README.md LICENSE

      # ── Signed Chromium Package ──
      - name: Pack Chromium CRX Extension
        env:
          CRX_PRIVATE_KEY: ${{ secrets.CRX_PRIVATE_KEY }}
        run: |
          if [ -z "$CRX_PRIVATE_KEY" ]; then
            echo "::warning::CRX_PRIVATE_KEY is not set; skipping the signed CRX."
            exit 0
          fi
          mkdir -p /tmp/pack-ext
          cp -r manifest.json shared.js content.js bridge.js background.js popup.html popup.css popup.js rules.css rules.json icons updates.xml README.md LICENSE /tmp/pack-ext/
          echo "$CRX_PRIVATE_KEY" > /tmp/key.pem
          google-chrome --pack-extension=/tmp/pack-ext --pack-extension-key=/tmp/key.pem
          mv /tmp/pack-ext.crx dist/TeamX-AdBlock.crx
          rm -rf /tmp/pack-ext /tmp/key.pem

      - name: Remove Signing Key
        if: always()
        run: rm -f /tmp/key.pem && rm -rf /tmp/pack-ext

      # ── Publication ──
      - name: Write Release Notes from the Changelog
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="v$VERSION" '
            flag && /^## \[/ { flag = 0 }
            !flag && index($0, "## [" ver "]") == 1 { flag = 1; next }
            flag { print }
          ' CHANGELOG.md > release_notes.txt
          if [ ! -s release_notes.txt ]; then
            echo "::warning::No CHANGELOG entry for v$VERSION; using fallback notes."
            printf 'See https://github.com/shadow-x78/teamx-adblock/blob/main/CHANGELOG.md for details.\n' > release_notes.txt
          fi
          cat release_notes.txt

      - name: Write Checksums
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          cd dist
          for asset in TeamX-AdBlock.zip TeamX-AdBlock.xpi TeamX-AdBlock.crx; do
            if [ -f "$asset" ]; then
              sha256sum "$asset" > "$asset.sha256"
            fi
          done
          ls -l

      - name: Upload Release Assets
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: TeamX - AdBlock ${{ github.ref_name }}
          body_path: release_notes.txt
          files: |
            dist/TeamX-AdBlock.zip
            dist/TeamX-AdBlock.zip.sha256
            dist/TeamX-AdBlock.xpi
            dist/TeamX-AdBlock.xpi.sha256
            dist/TeamX-AdBlock.crx
            dist/TeamX-AdBlock.crx.sha256
          generate_release_notes: false
