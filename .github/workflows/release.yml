# ─────────────────────────────────────────────
# TeamX - AdBlock - Release Workflow
# ─────────────────────────────────────────────

# ── Workflow Identity ──
name: Release & Package Extension

# ── Trigger ──
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# ── Permissions ──
permissions:
  contents: write

# ── Build Job ──
jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      # ── Repository & Tooling ──
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Forbid Tracked Signing Keys
        run: |
          if git ls-files | grep -Ei '\.(pem|key|p12|pfx)$'; then
            echo "::error::A signing key is tracked by git. Remove it and rotate the key."
            exit 1
          fi

      - name: Setup Node.js & Chrome
        uses: browser-actions/setup-chrome@c785b87e244131f27c9f19c1a33e2ead956ab7ce # v1
        with:
          chrome-version: stable

      # ── Unsigned Archives ──
      - name: Prepare Extension Archives (ZIP & Firefox XPI)
        run: |
          mkdir -p dist
          zip -r dist/TeamX-AdBlock.zip manifest.json content.js rules.css rules.json icons/ updates.xml README.md LICENSE
          mkdir -p /tmp/firefox-ext
          cp -r manifest.json content.js rules.css rules.json icons updates.xml README.md LICENSE /tmp/firefox-ext/
          node -e "const fs=require('fs');const p='/tmp/firefox-ext/manifest.json';const m=JSON.parse(fs.readFileSync(p,'utf8'));delete m.update_url;fs.writeFileSync(p,JSON.stringify(m,null,2)+'\n');"
          cd /tmp/firefox-ext && zip -r "$GITHUB_WORKSPACE/dist/TeamX-AdBlock.xpi" manifest.json content.js rules.css rules.json icons/ updates.xml README.md LICENSE

      # ── Signed Chromium Package ──
      - name: Pack Chromium CRX Extension
        if: env.CRX_PRIVATE_KEY != ''
        env:
          CRX_PRIVATE_KEY: ${{ secrets.CRX_PRIVATE_KEY }}
        run: |
          mkdir -p /tmp/pack-ext
          cp -r manifest.json content.js rules.css rules.json icons updates.xml README.md LICENSE /tmp/pack-ext/
          echo "$CRX_PRIVATE_KEY" > /tmp/key.pem
          google-chrome --pack-extension=/tmp/pack-ext --pack-extension-key=/tmp/key.pem
          mv /tmp/pack-ext.crx dist/TeamX-AdBlock.crx
          rm -rf /tmp/pack-ext /tmp/key.pem

      - name: Remove Signing Key
        if: always()
        run: rm -f /tmp/key.pem && rm -rf /tmp/pack-ext

      # ── Publication ──
      - name: Upload Release Assets
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/TeamX-AdBlock.zip
            dist/TeamX-AdBlock.xpi
            dist/TeamX-AdBlock.crx
          generate_release_notes: true
