name: Release & Package Extension

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js & Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Prepare Extension Archive
        run: |
          mkdir -p dist
          zip -r dist/TeamX-AdBlock.zip manifest.json content.js icons/ updates.xml README.md LICENSE

      - name: Pack CRX Extension
        if: env.CRX_PRIVATE_KEY != ''
        env:
          CRX_PRIVATE_KEY: ${{ secrets.CRX_PRIVATE_KEY }}
        run: |
          echo "$CRX_PRIVATE_KEY" > /tmp/key.pem
          google-chrome --pack-extension=${{ github.workspace }} --pack-extension-key=/tmp/key.pem
          mv ../TeamX-AdBlock.crx dist/TeamX-AdBlock.crx
          rm -f /tmp/key.pem

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/TeamX-AdBlock.zip
            dist/TeamX-AdBlock.crx
          generate_release_notes: true
