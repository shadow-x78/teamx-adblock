<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TeamX - AdBlock</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="head">
    <img class="mark" src="../icons/icon48.png" alt="" width="34" height="34">
    <div class="identity">
      <h1 class="name">TeamX AdBlock</h1>
      <p class="status" id="status" data-state="on">
        <span class="dot" aria-hidden="true"></span>
        <span id="statusText"></span>
      </p>
    </div>
  </header>

  <section class="card counter" aria-live="polite">
    <p class="number" id="blockedTotal">0</p>
    <p class="caption" id="blockedCaption"></p>
    <p class="today" id="blockedToday"></p>
  </section>

  <section class="card control">
    <div class="control-copy">
      <p class="control-title" id="controlTitle"></p>
      <p class="control-hint" id="controlHint"></p>
    </div>
    <button
      class="switch"
      id="toggle"
      type="button"
      role="switch"
      aria-checked="true"
      aria-labelledby="controlTitle"
      disabled
    >
      <span class="knob" aria-hidden="true"></span>
    </button>
  </section>

  <div class="segmented" id="langGroup" role="group" aria-label="Language">
    <button class="seg" type="button" data-lang="ar" aria-pressed="true">العربية</button>
    <button class="seg" type="button" data-lang="en" aria-pressed="false">English</button>
  </div>

  <button class="update" id="update" type="button">
    <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true" focusable="false">
      <path fill="currentColor" d="M8 1.5a6.5 6.5 0 0 0-6.28 4.83.75.75 0 1 0 1.45.38A5 5 0 0 1 12.2 5.5h-1.7a.75.75 0 0 0 0 1.5h3.25a.75.75 0 0 0 .75-.75V3a.75.75 0 0 0-1.5 0v1.02A6.5 6.5 0 0 0 8 1.5Zm5.53 7.34a.75.75 0 0 0-.9.53A5 5 0 0 1 3.8 10.5h1.7a.75.75 0 0 0 0-1.5H2.25a.75.75 0 0 0-.75.75V13a.75.75 0 0 0 1.5 0v-1.02A6.5 6.5 0 0 0 14.28 9.7a.75.75 0 0 0-.53-.9Z"/>
    </svg>
    <span id="updateText"></span>
  </button>

  <button class="repo" id="repo" type="button">
    <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true" focusable="false">
      <path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/>
    </svg>
    <span id="repoText"></span>
  </button>

  <footer class="foot">
    <p id="copyright"></p>
    <p class="version" id="version">v0.0.0</p>
  </footer>

  <script src="shared.js"></script>
  <script src="popup.js"></script>
</body>
</html>
